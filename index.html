<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>협력사 수배현황 대시보드</title>
    <!-- 폰트 적용 (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="style.css">
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- 좌측 사이드바 (Team Navigate) -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <h1>협력사 수배현황</h1>
            </div>
            <ul id="teamNav" class="nav-list">
                <li class="nav-item active" data-team="all">
                    <span>전체</span>
                </li>
            </ul>
        </aside>

        <!-- 우측 메인 디스플레이 -->
        <main class="main-content">
            <!-- 상단 바 (현재 탭 정보 및 필터) -->
            <header class="topbar glass-panel">
                <div class="topbar-left">
                    <h2 id="currentTeamTitle">전체 현황</h2>
                </div>
                <div class="topbar-right filter-controls">
                    <div class="filter-group">
                        <select id="monthSelect">
                            <!-- JS 동적 렌더링 -->
                        </select>
                    </div>
                </div>
            </header>

            <!-- 주요 KPI 요약 섹션 -->
            <div class="section-header">
                <h3 class="section-label">주요 KPI 요약</h3>
            </div>

            <!-- 핵심 지표 (KPI Cards) -->
            <section class="kpi-section">
                <!-- KPI 1 : 송출 인원 -->
                <div class="kpi-card glass-panel">
                    <h3>당월 송출 인원</h3>
                    <div class="kpi-value"><span id="kpiPersonnelCurrent">0</span> 명</div>
                    <div class="kpi-trend" id="kpiPersonnelTrend">
                        <span class="trend-icon">-</span> <span class="trend-text">0명 (0%)</span>
                    </div>
                </div>
                <!-- KPI 2 : 지상비 -->
                <div class="kpi-card glass-panel">
                    <h3>당월 총 지상비 (비용)</h3>
                    <div class="kpi-value"><span id="kpiCostCurrent">0</span> 원</div>
                    <div class="kpi-trend" id="kpiCostTrend">
                        <span class="trend-icon">-</span> <span class="trend-text">0원 (0%)</span>
                    </div>
                </div>
                <!-- KPI 3 : 1위 협력사 -->
                <div class="kpi-card glass-panel kpi-highlight">
                    <h3>당월 최다 송출 협력사</h3>
                    <div class="kpi-value top-partner" id="kpiTopPartner">-</div>
                    <div class="kpi-trend muted" id="kpiTopPartnerPrev">전월 최다: -</div>
                </div>
            </section>

            <!-- 시각화 차트 영역 -->
            <div class="section-header">
                <h3 class="section-label">협력사별 비교</h3>
                <div class="compare-toggles section-toggles" id="globalCompareToggles">
                    <button class="toggle-btn active" data-type="mom">전월</button>
                    <button class="toggle-btn" data-type="yoy">전년 동월</button>
                </div>
            </div>
            <section class="chart-section">
                <!-- 동적 차트 1 -->
                <div class="chart-container glass-panel chart-full">
                    <div class="chart-header-row">
                        <h3 class="section-title" id="chart1Title">팀별 송출 인원 비교</h3>
                    </div>
                    <div id="chart1" class="chart"></div>
                </div>
                
                <!-- 동적 차트 2 -->
                <div class="chart-container glass-panel chart-full">
                    <div class="chart-header-row">
                        <h3 class="section-title" id="chart2Title">팀별 지상비 비교</h3>
                    </div>
                    <div id="chart2" class="chart"></div>
                </div>
            </section>

            <!-- 하단 상세 테이블 -->
            <div class="section-header">
                <h3 class="section-label">협력사별 수배현황</h3>
                <div class="table-view-toggles">
                    <button class="view-btn active" id="viewModeList">전체</button>
                    <button class="view-btn" id="viewModeGroup">지역별</button>
                </div>
            </div>
            <section class="table-section glass-panel">
                <div class="table-header">
                    <div class="table-actions">
                        <span id="dataCount">0건 탑재됨</span>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table id="dataTable">
                        <thead>
                            <tr id="tableHeadRow">
                                <!-- JS 동적 생성 -->
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- JS에서 동적 주입 -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- 스크립트 연결 -->
    <script src="app.js"></script>
</body>
</html>
